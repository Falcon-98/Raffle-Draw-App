name: Deploy to GitHub Pages

# CI: every pull request to main is type-checked and built (nothing is deployed).
# CD: every push to main (or a manual run) builds and publishes the site to GitHub Pages.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Work out the base path
        id: base
        run: |
          REPO="${{ github.event.repository.name }}"
          if [[ "$REPO" == *.github.io ]] || [[ -n "${{ vars.CUSTOM_DOMAIN }}" ]]; then
            echo "path=" >> "$GITHUB_OUTPUT"
          else
            echo "path=/$REPO" >> "$GITHUB_OUTPUT"
          fi

      # Fails with a clear message if Pages is not enabled for this repository.
      # Settings → Pages → Source must be "GitHub Actions" (not "Deploy from a branch").
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build static site
        run: |
          # Optional default live server address (repository variable LIVE_SERVER_URL).
          if [ -n "$LIVE_SERVER_URL" ]; then export NEXT_PUBLIC_LIVE_SERVER_URL="$LIVE_SERVER_URL"; fi
          npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.base.outputs.path }}
          # Set this under Settings → Secrets and variables → Actions → Secrets
          NEXT_PUBLIC_ADMIN_PIN: ${{ secrets.ADMIN_PIN }}
          LIVE_SERVER_URL: ${{ vars.LIVE_SERVER_URL }}

      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: out

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
